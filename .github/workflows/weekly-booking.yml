name: Weekly Restaurant Booking

on:
  schedule:
    # Every Monday at 07:00 UTC = 10:00 Israel summer time (UTC+3)
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      guests:
        description: 'Number of guests'
        required: false
        default: '2'
        type: string
      dry_run:
        description: 'Dry run – fill form but do not submit'
        required: false
        default: false
        type: boolean

jobs:
  book-restaurant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: playwright install --with-deps chromium

      - name: Run booking
        env:
          CONTACT_NAME: ${{ secrets.CONTACT_NAME }}
          CONTACT_PHONE: ${{ secrets.CONTACT_PHONE }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          GUESTS="${{ github.event.inputs.guests || '2' }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            python restaurant_booking.py --guests "$GUESTS" --dry-run
          else
            python restaurant_booking.py --guests "$GUESTS"
          fi

      - name: Upload screenshots (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-run-${{ github.run_number }}
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-run-${{ github.run_number }}
          path: '*.log'
          if-no-files-found: ignore
